<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f5e5b8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#aa771c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlightLeft" cx="15%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlightRight" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#f3e5ab" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E5C05B"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="50%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,243,209,0.7)"/>
      <stop offset="50%" stop-color="rgba(212,175,55,0.3)"/>
      <stop offset="100%" stop-color="rgba(170,119,28,0.6)"/>
    </linearGradient>
    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#cardBg)"/>

  <!-- Stage Lighting Beams -->
  <rect width="800" height="1000" fill="url(#stageGlow)"/>
  <rect width="800" height="1000" fill="url(#spotlightLeft)"/>
  <rect width="800" height="1000" fill="url(#spotlightRight)"/>

  <!-- Subtle Stage Grid & Sparkles -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="800" y2="1000" stroke="#d4af37" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="0" y2="1000" stroke="#d4af37" stroke-width="0.5"/>
  </g>

  <!-- Sparkling Stars -->
  <g fill="#FFF3D1" opacity="0.6">
    <circle cx="144.0" cy="220.0" r="2"/>
    <circle cx="656.0" cy="260.0" r="2.5"/>
    <circle cx="200.0" cy="720.0" r="1.5"/>
    <circle cx="624.0" cy="680.0" r="2"/>
    <polygon points="144.0,214.0 146.0,220.0 144.0,226.0 142.0,220.0"/>
    <polygon points="656.0,253.0 658.0,260.0 656.0,267.0 654.0,260.0"/>
  </g>

  <!-- Elegant Decorative Inner Border -->
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="16"/>
  <rect x="28" y="28" width="744" height="944" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1" rx="12"/>

  <!-- Corner Flourishes -->
  <path d="M 20 50 L 50 20 M 20 20 L 40 20 M 20 20 L 20 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 780 50 L 750 20 M 780 20 L 760 20 M 780 20 L 780 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 20 950 L 50 980 M 20 980 L 40 980 M 20 980 L 20 960" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 780 950 L 750 980 M 780 980 L 760 980 M 780 980 L 780 960" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

  <!-- Center Stage Icon / Graphic -->
  <g transform="translate(400.0, 400.0)">
    <!-- Glowing Halo -->
    <circle r="70" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle r="60" fill="rgba(212,175,55,0.06)" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <!-- Microphone & Stage Icon -->
    <g transform="translate(-24, -28) scale(1.6)" fill="url(#goldGrad)" filter="url(#goldDrop)">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400.0, 630.0)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(212,175,55,0.12)" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#FFF3D1" text-anchor="middle">PRIVATE EVENTS</text>
  </g>

  <!-- Main Title -->
  <text x="400.0" y="720.0" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">Private Social Gathering</text>

  <!-- Subtitle -->
  <text x="400.0" y="780.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#E2DFD8" text-anchor="middle" letter-spacing="0.5">Custom Themed Family Evening</text>

  <!-- Hint Badge -->
  <g transform="translate(400.0, 880.0)">
    <rect x="-160" y="-14" width="320" height="28" rx="6" fill="#07080b" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Courier New', monospace" font-size="11" fill="#C59B27" text-anchor="middle">📷 Replace with /images/gallery/manisha-10.jpg</text>
  </g>
</svg>