<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f5e5b8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#aa771c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlightLeft" cx="15%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlightRight" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#f3e5ab" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E5C05B"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="50%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,243,209,0.7)"/>
      <stop offset="50%" stop-color="rgba(212,175,55,0.3)"/>
      <stop offset="100%" stop-color="rgba(170,119,28,0.6)"/>
    </linearGradient>
    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="540" fill="url(#cardBg)"/>

  <!-- Stage Lighting Beams -->
  <rect width="960" height="540" fill="url(#stageGlow)"/>
  <rect width="960" height="540" fill="url(#spotlightLeft)"/>
  <rect width="960" height="540" fill="url(#spotlightRight)"/>

  <!-- Subtle Stage Grid & Sparkles -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="960" y2="540" stroke="#d4af37" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="0" y2="540" stroke="#d4af37" stroke-width="0.5"/>
  </g>

  <!-- Sparkling Stars -->
  <g fill="#FFF3D1" opacity="0.6">
    <circle cx="172.79999999999998" cy="118.8" r="2"/>
    <circle cx="787.1999999999999" cy="140.4" r="2.5"/>
    <circle cx="240.0" cy="388.8" r="1.5"/>
    <circle cx="748.8000000000001" cy="367.20000000000005" r="2"/>
    <polygon points="172.79999999999998,112.8 174.79999999999998,118.8 172.79999999999998,124.8 170.79999999999998,118.8"/>
    <polygon points="787.1999999999999,133.4 789.1999999999999,140.4 787.1999999999999,147.4 785.1999999999999,140.4"/>
  </g>

  <!-- Elegant Decorative Inner Border -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="16"/>
  <rect x="28" y="28" width="904" height="484" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1" rx="12"/>

  <!-- Corner Flourishes -->
  <path d="M 20 50 L 50 20 M 20 20 L 40 20 M 20 20 L 20 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 940 50 L 910 20 M 940 20 L 920 20 M 940 20 L 940 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 20 490 L 50 520 M 20 520 L 40 520 M 20 520 L 20 500" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 940 490 L 910 520 M 940 520 L 920 520 M 940 520 L 940 500" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

  <!-- Center Stage Icon / Graphic -->
  <g transform="translate(480.0, 216.0)">
    <!-- Glowing Halo -->
    <circle r="70" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle r="60" fill="rgba(212,175,55,0.06)" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <!-- Microphone & Stage Icon -->
    <g transform="translate(-24, -28) scale(1.6)" fill="url(#goldGrad)" filter="url(#goldDrop)">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(480.0, 340.2)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(212,175,55,0.12)" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#FFF3D1" text-anchor="middle">WEDDING REEL</text>
  </g>

  <!-- Main Title -->
  <text x="480.0" y="388.8" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">Grand Wedding Showreel</text>

  <!-- Subtitle -->
  <text x="480.0" y="421.2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#E2DFD8" text-anchor="middle" letter-spacing="0.5">Highlights of Sangeet & Reception Hosting</text>

  <!-- Hint Badge -->
  <g transform="translate(480.0, 475.2)">
    <rect x="-160" y="-14" width="320" height="28" rx="6" fill="#07080b" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Courier New', monospace" font-size="11" fill="#C59B27" text-anchor="middle">📷 Replace with /images/videos/video-thumb-01.jpg</text>
  </g>
</svg>